name: 🛡️ DevSecOps Pipeline

# 1. TRIGGERS: When does this run?
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: whoozh-learning
  ECS_SERVICE: whoozh-task-service-i1009apx
  ECS_CLUSTER: whoozh-cluster
  ECS_TASK_DEFINITION: whoozh-task # The family name of your task definition    

jobs:
  # -------------------------------------------------------------
  # JOB 1: SECRET SCANNING (TruffleHog)
  # -------------------------------------------------------------
  scan-secrets:
    name: 🔑 Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # Needs full history to find hidden secrets
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@00155c9dc586f34d189adc83d3ac2698c2ec551f
        with:
          path: ./
          extra_args: --debug --only-verified
         

  # -------------------------------------------------------------
  # JOB 2: STATIC ANALYSIS / SAST (Semgrep)
  # -------------------------------------------------------------
  scan-code:
    name: 🧠 SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep ci --config=p/default
      

  # -------------------------------------------------------------
  # JOB 3: DEPENDENCY SCANNING / SCA (Snyk)
  # -------------------------------------------------------------
  scan-dependencies:
    name: 📦 Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      
      - name: Setup Node.js
        uses: actions/setup-node@1d43b558a28a475868693a55813060bb2c975b0d # v4.2.0
        with:
          node-version: '26' # Matches your NestJS/Next.js environment
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@6d07e600ab80a82329388147d3d3fbbe87fcbf44
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test # Tests package.json and blocks on Critical bugs
          args: --file=package-lock.json --strict-out-of-sync=false --fail-on=all
  # -------------------------------------------------------------
  # JOB 4: CONTAINER SCANNING (Trivy)
  # -------------------------------------------------------------
  scan-container:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    # Only run this if the previous jobs pass
    needs: [scan-secrets, scan-code, scan-dependencies] 
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        
      - name: Build Docker Image
        # Builds a local image of your app to test it before pushing to a registry
        run: docker build --no-cache -t my-app:${{ github.sha }} .
        
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@851abc19586fe38202315fa7a1a017fe4528aa7f
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'json'
          exit-code: '1' # Fails the build if it finds issues
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'
  #------------------------------------------------------------------
  # JOB 5: DAST (OWASP ZAP)
  #------------------------------------------------------------------  
  scan-dast:
    name: 🌐 DAST Scan
    runs-on: ubuntu-latest
    needs: [scan-container]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-node@1d43b558a28a475868693a55813060bb2c975b0d # v4.2.0
        with:
          node-version: 26

      - run: npm ci

      - run: npm run build

      - name: Start Application
        run: |
          npm start &
          sleep 30

      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@90d297ec6b64d3065961a86db90e290f9366df04 # v0.14.0
        with:
          target: 'http://localhost:3000'
          rules_file_name: 'zap-rules.tsv'
          cmd_options: '-c zap-rules.tsv'
          fail_action: true
#------------------------------------------------------------------
  # JOB 6: AWS ECS DEPLOYMENT (Only runs if DAST passes)
  #------------------------------------------------------------------  
  deploy-to-aws:
    name: 🚀 Deploy to Amazon ECS
    runs-on: ubuntu-latest
    needs: [scan-dast] 
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@eceedea25562c73c4e5f9428ec7aa8ec09ac6543 # v4.0.1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@061057e466a922edd728bc0181442c6753858f27 # v2.0.5

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Download current task definition blueprint
        run: |
          aws ecs describe-task-definition --task-definition ${{ env.ECS_TASK_DEFINITION }} --query taskDefinition > task-definition.json

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@c804dfbdd76286407b416fa3521e1495c2560378 # v1.6.2
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ steps.build-image.outputs.image }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@df9643053eda01f124930741615211de438e602c # v2.1.2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true