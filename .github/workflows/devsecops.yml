name: 🛡️ DevSecOps Pipeline

# 1. TRIGGERS: When does this run?
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1: SECRET SCANNING (TruffleHog)
  # -------------------------------------------------------------
  scan-secrets:
    name: 🔑 Secret Scanner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needs full history to find hidden secrets
      
      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --debug --only-verified
         

  # -------------------------------------------------------------
  # JOB 2: STATIC ANALYSIS / SAST (Semgrep)
  # -------------------------------------------------------------
  scan-code:
    name: 🧠 SAST Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep ci --config=p/default --text --verbose || true
      

  # -------------------------------------------------------------
  # JOB 3: DEPENDENCY SCANNING / SCA (Snyk)
  # -------------------------------------------------------------
  scan-dependencies:
    name: 📦 Dependency Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Matches your NestJS/Next.js environment
          
      - name: Install Dependencies
        run: npm ci
        
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          command: test # Tests package.json and blocks on Critical bugs
          args: --strict-out-of-sync=false
  # -------------------------------------------------------------
  # JOB 4: CONTAINER SCANNING (Trivy)
  # -------------------------------------------------------------
  scan-container:
    name: 🐳 Docker Image Scan
    runs-on: ubuntu-latest
    # Only run this if the previous jobs pass
    needs: [scan-secrets, scan-code, scan-dependencies] 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Build Docker Image
        # Builds a local image of your app to test it before pushing to a registry
        run: docker build -t my-app:${{ github.sha }} .
        
      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'my-app:${{ github.sha }}'
          format: 'table'
          exit-code: '1' # Fails the build if it finds issues
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'